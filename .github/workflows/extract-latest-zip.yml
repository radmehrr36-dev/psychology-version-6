name: Extract latest uploaded website ZIP

on:
  push:
    branches: [main]
    paths:
      - "*.zip"
      - ".github/workflows/extract-latest-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-latest-website-zip
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and safely extract newest root ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -printf '%T@ %p\\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          if [ -z "${ZIP_FILE}" ]; then
            echo "No ZIP archive found in repository root."
            exit 1
          fi
          echo "Selected archive: ${ZIP_FILE}"
          python - "${ZIP_FILE}" <<'PY'
          import os, sys, zipfile, shutil
          archive = sys.argv[1]
          destination = "extracted/latest-upload"
          os.makedirs(destination, exist_ok=True)
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename.replace("\\\\", "/")
                  parts = name.split("/")
                  if name.startswith("/") or any(p == ".." for p in parts):
                      raise SystemExit(f"Unsafe ZIP path rejected: {name}")
                  base = os.path.basename(name).lower()
                  # Never publish real environment files or dependency/build caches.
                  if base in {".env", ".env.local", ".env.production", ".env.development"}:
                      print(f"Skipped sensitive environment file: {name}")
                      continue
                  if any(p in {"node_modules", ".git", "dist"} for p in parts):
                      continue
                  target = os.path.join(destination, *parts)
                  if info.is_dir():
                      os.makedirs(target, exist_ok=True)
                      continue
                  os.makedirs(os.path.dirname(target), exist_ok=True)
                  with zf.open(info) as src, open(target, "wb") as dst:
                      shutil.copyfileobj(src, dst)
          print(f"Extraction completed into {destination}")
          PY

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted/latest-upload
          if git diff --cached --quiet; then
            echo "No extracted source changes to commit."
          else
            git commit -m "Extract latest uploaded website archive"
            git push
          fi
