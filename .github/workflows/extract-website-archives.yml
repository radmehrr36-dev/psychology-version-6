name: Extract and compare website archives

on:
  push:
    paths:
      - ".github/workflows/extract-website-archives.yml"
      - "extract-archives.trigger"
  workflow_dispatch:

concurrency:
  group: extract-website-archives-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract both archives safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import shutil

          root = Path.cwd()
          archives = [
              ("recreate-pixel-perfect-website(5).zip", "extracted/version-5"),
              ("recreate-pixel-perfect-website(9).zip", "extracted/version-9"),
          ]

          for archive_name, destination_name in archives:
              archive_path = root / archive_name
              if not archive_path.is_file():
                  raise SystemExit(f"Missing archive: {archive_name}")

              destination = root / destination_name
              if destination.exists():
                  shutil.rmtree(destination)
              destination.mkdir(parents=True, exist_ok=True)

              with ZipFile(archive_path) as zf:
                  for info in zf.infolist():
                      member = PurePosixPath(info.filename)
                      if member.is_absolute() or ".." in member.parts:
                          raise SystemExit(f"Unsafe ZIP path: {info.filename}")
                      if not member.parts or member.parts[0] == ".git":
                          continue
                      target = (destination / Path(*member.parts)).resolve()
                      if destination.resolve() not in target.parents and target != destination.resolve():
                          raise SystemExit(f"ZIP path escapes destination: {info.filename}")
                      if info.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                      else:
                          target.parent.mkdir(parents=True, exist_ok=True)
                          with zf.open(info) as src, target.open("wb") as dst:
                              shutil.copyfileobj(src, dst)

              files = [p for p in destination.rglob("*") if p.is_file()]
              print(f"{archive_name}: extracted {len(files)} files into {destination_name}")

          PY

      - name: Commit extracted source trees
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted/
          if git diff --cached --quiet; then
            echo "No extracted-file changes to commit."
          else
            git commit -m "Extract website archives 5 and 9 for source comparison"
            git push
          fi
