name: Extract ZIP into repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded ZIP
        run: |
          ZIP_FILE="recreate-pixel-perfect-website(4).zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found: $ZIP_FILE"
            exit 1
          fi
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted
          if git diff --cached --quiet; then
            echo "No extracted file changes to commit."
            exit 0
          fi
          git commit -m "Extract uploaded website ZIP"
          git push
